name: Build, Push and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            syntaxdesigner/cfbf-cms:latest
            syntaxdesigner/cfbf-cms:${{ github.sha }}

      - name: Trigger Dokploy Deployment
        if: success()
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK not set — skipping deployment trigger."
            exit 0
          fi

          echo "Triggering Dokploy deployment..."

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$DOKPLOY_WEBHOOK")

          echo "Dokploy response code: $RESPONSE"

          if [ "$RESPONSE" != "200" ]; then
            echo "Deployment trigger failed!"
            exit 1
          fi

      - name: Deployment Triggered
        if: success()
        run: echo "Dokploy deployment started successfully"
