version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cfbf-strapi
    environment:
      # Server
      HOST: "${HOST:-0.0.0.0}"
      PORT: "${PORT:-1341}"

      # App Secrets
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}

      # Database (Postgres only — see config/database.ts)
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA}
      DATABASE_SSL: "${DATABASE_SSL:-false}"
      DATABASE_CONNECTION_TIMEOUT: "${DATABASE_CONNECTION_TIMEOUT:-60000}"

      # Cloudinary media storage (see config/plugins.ts)
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET}

    # Routing is managed by Dokploy's Domains tab, which injects Traefik
    # labels at deploy time. Do not add labels here.

    networks:
      - dokploy-network

    ports:
      - "${PORT:-1341}:1341"

    volumes:
      - strapi_uploads:/app/public/uploads

volumes:
  strapi_uploads:
    name: cef_strapi_uploads

networks:
  dokploy-network:
    external: true
