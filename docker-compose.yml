version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cfbf-strapi
    environment:
      # Server
      HOST: "${HOST:-0.0.0.0}"
      PORT: "${PORT:-1341}"

      # Public origin + proxy awareness (see config/server.ts). PUBLIC_URL must be
      # the real https:// domain Traefik serves, or the admin panel emits
      # http://0.0.0.0:1341 links and admin cookies are scoped to the wrong host.
      PUBLIC_URL: ${PUBLIC_URL}
      IS_PROXIED: "${IS_PROXIED:-true}"

      # App Secrets
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}

      # Database (Postgres only — see config/database.ts)
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA}
      DATABASE_SSL: "${DATABASE_SSL:-false}"
      DATABASE_CONNECTION_TIMEOUT: "${DATABASE_CONNECTION_TIMEOUT:-60000}"

      # Cloudinary media storage (see config/plugins.ts)
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET}

    # Routing is managed by Dokploy's Domains tab, which injects Traefik
    # labels at deploy time. Do not add labels here.

    restart: unless-stopped

    # Strapi syncs its schema on boot against the remote Postgres, which measured
    # ~107s cold locally — hence the generous start_period. wget/curl are absent
    # from node:20-alpine, so the probe uses node itself.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:1341/_health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

    networks:
      - dokploy-network

    # The container always listens on 1341 (ENV PORT=1341 in the Dockerfile), so
    # PORT only moves the host-side binding here — setting it in Dokploy will not
    # relocate the listener.
    ports:
      - "${PORT:-1341}:1341"

    volumes:
      - strapi_uploads:/app/public/uploads

volumes:
  strapi_uploads:
    name: cef_strapi_uploads

networks:
  dokploy-network:
    external: true
